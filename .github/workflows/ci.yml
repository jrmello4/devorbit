name: DevOrbit CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: devorbit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  release:
    name: Publicar instalador e atualização
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Definir versão da publicação
        run: |
          $version = "1.0.${{ github.run_number }}"
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          npm version $version --no-git-tag-version --ignore-scripts

      - name: Criar release para a versão
        run: gh release create "v$env:RELEASE_VERSION" --target "$env:GITHUB_SHA" --title "DevOrbit $env:RELEASE_VERSION" --notes "Atualização automática do DevOrbit."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar e publicar instalador NSIS
        run: |
          npm run build
          npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
