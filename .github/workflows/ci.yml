name: DevOrbit CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: devorbit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade e pacote Windows
    runs-on: windows-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test typecheck
        run: npm run typecheck:test

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: UI verification (Electron)
        run: npm run verify:ui

      - name: Runtime verification (Electron IPC)
        run: npm run verify:runtime

      - name: IPC/preload smoke (real preload)
        run: npm run smoke:ipc

      - name: Definir versão do pacote
        id: version
        shell: pwsh
        run: |
          $isMainPush = '${{ github.event_name }}' -eq 'push' -and '${{ github.ref }}' -eq 'refs/heads/main'
          if ($isMainPush) {
            $version = "1.0.${{ github.run_number }}"
            npm version $version --no-git-tag-version --ignore-scripts
          } else {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          }
          "release_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Exigir secrets de assinatura
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_THUMBPRINT)) {
            Write-Error 'CSC_LINK, CSC_KEY_PASSWORD e WINDOWS_CERTIFICATE_THUMBPRINT são obrigatórios para publicar.'
            exit 1
          }

      - name: Empacotar NSIS e portable (sem publicar)
        run: npx electron-builder --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Validar artefatos esperados
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.release_version }}'
          $expected = @(
            "release/DevOrbit-$version-x64.exe",
            "release/DevOrbit-$version-portable.exe",
            "release/latest.yml"
          )
          $missing = @($expected | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -gt 0) {
            Write-Error ("Artefatos ausentes: " + ($missing -join ', '))
            exit 1
          }
          $expected | ForEach-Object { Write-Host "OK $_" }

      - name: Validar Authenticode dos EXEs
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          EXPECTED_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          $version = '${{ steps.version.outputs.release_version }}'
          $expectedThumbprint = ($env:EXPECTED_THUMBPRINT -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          if ([string]::IsNullOrWhiteSpace($expectedThumbprint)) {
            Write-Error 'WINDOWS_CERTIFICATE_THUMBPRINT ausente.'
            exit 1
          }
          $targets = @(
            "release/DevOrbit-$version-x64.exe",
            "release/DevOrbit-$version-portable.exe",
            "release/win-unpacked/DevOrbit.exe"
          )
          $invalid = @()
          foreach ($target in $targets) {
            if (-not (Test-Path -LiteralPath $target -PathType Leaf)) {
              $invalid += "$target (ausente)"
              continue
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
              $invalid += "$target ($($signature.Status))"
              continue
            }
            $actualThumbprint = ($signature.SignerCertificate.Thumbprint -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
            if ($actualThumbprint -ne $expectedThumbprint) {
              $invalid += "$target (thumbprint divergente)"
            }
          }
          if ($invalid.Count -gt 0) {
            Write-Error ('Assinatura Authenticode inválida: ' + ($invalid -join '; '))
            exit 1
          }
          Write-Host 'Authenticode: Valid e thumbprint correspondente em todos os EXEs.'

      - name: Smoke dos pacotes Windows
        run: npm run smoke:package

      - name: Enviar pacote validado como artefato
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: devorbit-windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7

      - name: Upload UI artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts
          path: artifacts/ui

  release:
    name: Publicar instalador e atualização
    needs: quality
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validar versão da publicação
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag inválida: $env:RELEASE_TAG. Use o formato vMAJOR.MINOR.PATCH."
          }

          $tagVersion = $env:RELEASE_TAG.Substring(1)
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $tagVersion) {
            throw "A tag $env:RELEASE_TAG não corresponde à versão do package.json ($packageVersion)."
          }

          "RELEASE_VERSION=$tagVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Baixar pacote validado
        uses: actions/download-artifact@v4
        with:
          name: devorbit-windows
          path: release

      - name: Criar release para a versão
        run: |
          gh release view "$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" --target "$env:GITHUB_SHA" --title "DevOrbit $env:RELEASE_VERSION" --notes "Atualização do DevOrbit."
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Publicar artefatos validados
        run: |
          $assetPaths = @(
            "release/DevOrbit-$env:RELEASE_VERSION-x64.exe"
            "release/DevOrbit-$env:RELEASE_VERSION-x64.exe.blockmap"
            "release/DevOrbit-$env:RELEASE_VERSION-portable.exe"
            "release/latest.yml"
          )
          foreach ($assetPath in $assetPaths) {
            if (-not (Test-Path -LiteralPath $assetPath)) { throw "Asset de release ausente: $assetPath" }
          }
          gh release upload "$env:RELEASE_TAG" $assetPaths --clobber
          $portable = Get-ChildItem -LiteralPath release -Filter 'DevOrbit-*-portable.exe' | Select-Object -First 1
          if (-not $portable) { throw 'Executável portable não foi gerado.' }
          $hash = (Get-FileHash -LiteralPath $portable.FullName -Algorithm SHA512).Hash.ToLowerInvariant()
          $manifest = @(
            "version: $env:RELEASE_VERSION"
            "path: $($portable.Name)"
            "sha512: $hash"
            "releaseDate: $([DateTime]::UtcNow.ToString('o'))"
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'release/latest-portable.yml'), $manifest, (New-Object Text.UTF8Encoding($false)))
          gh release upload "$env:RELEASE_TAG" release/latest-portable.yml --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
